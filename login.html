<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login • LAMF LMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/theme.css">

  
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1220">

</head>
<body>
  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <span style="background:var(--g1); -webkit-background-clip:text; background-clip:text; color:transparent;">
                    <img src="logo.png" width="50%" alt="">
        </span>
      </a>
      <div class="ms-auto">
        <a href="index.html" class="btn btn-outline-lux">Back</a>
      </div>
    </div>
  </nav>

  <div class="container" style="padding-top:110px; padding-bottom:60px;">
    <div class="row justify-content-center">
      <div class="col-lg-5">
        <div class="lux-card p-4">
          <h2 class="lux-title mb-2">Admin Login</h2>
          <p class="text-muted-lux mb-4">JWT-secured dashboard access.</p>

          <div class="mb-3">
            <label class="form-label text-muted-lux">Username</label>
            <input id="username" class="form-control" placeholder="admin" value="admin" />
          </div>
          <div class="mb-3">
            <label class="form-label text-muted-lux">Password</label>
            <input id="password" type="password" class="form-control" placeholder="admin123" value="admin123" />
          </div>

          <button id="btnLogin" class="btn btn-lux w-100">Login</button>

          <hr class="my-4">
          <div class="text-muted-lux small">
            Demo creds: <code class="kbd">admin</code> / <code class="kbd">admin123</code>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    document.getElementById("btnLogin").addEventListener("click", async () => {
      try {
        const u = document.getElementById("username").value.trim();
        const p = document.getElementById("password").value;
        await login(u, p);
        toast("Login successful", "success");
        setTimeout(() => window.location.href = "dashboard.html", 350);
      } catch (e) {
        toast(e.message || "Login failed", "error");
      }
    });
  </script>

  
  <script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/service-worker.js");
  }
</script>
</body>
</html>
