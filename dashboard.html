<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard • LAMF LMS</title>
  <meta name="description" content="Manage loan products, applications, collateral, ongoing loans and repayments from the LAMF LMS dashboard." />
  <meta name="author" content="TheBenzzCreations" />
  <meta name="creator" content="TheBenzzCreations" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="LAMF LMS" />
  <meta property="og:title" content="Dashboard • LAMF LMS" />
  <meta property="og:description" content="Manage loan products, applications, collateral, ongoing loans and repayments from the LAMF LMS dashboard." />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Dashboard • LAMF LMS" />
  <meta name="twitter:description" content="Manage loan products, applications, collateral, ongoing loans and repayments from the LAMF LMS dashboard." />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/theme.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container-fluid px-3">
      <a class="navbar-brand fw-bold" href="index.html">
        <span style="background:var(--g1); -webkit-background-clip:text; background-clip:text; color:transparent;">
                    <img src="logo.png" width="40%" alt="">
        </span>
      </a>

      <div class="ms-auto d-flex align-items-center gap-2">
        <span class="lux-badge d-none d-md-inline-flex">
          <span>JWT Secured</span>
          <span style="opacity:.75">/api/**</span>
        </span>
        <button class="btn btn-outline-lux" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container-fluid" style="padding-top:85px;">
    <div class="row g-3 px-2 px-md-3">
      <!-- Sidebar -->
      <div class="col-lg-2">
        <div class="lux-card sidebar">
          <div class="text-muted-lux small mb-2">Modules</div>
          <div class="nav flex-column nav-pills" id="sideNav">
            <button class="nav-link active" data-page="overview">Overview</button>
            <button class="nav-link" data-page="products">Loan Products</button>
            <button class="nav-link" data-page="applications">Loan Applications</button>
            <button class="nav-link" data-page="newApp">Create New Application</button>
            <button class="nav-link" data-page="loans">Ongoing Loans</button>
            <button class="nav-link" data-page="collaterals">Collateral Management</button>
            <!-- <button class="nav-link" data-page="partnerApi" type="button">Partner API</button> -->

          </div>

          <hr class="my-3">
          <div class="text-muted-lux small mb-2">Partner API</div>
          <div class="lux-card-soft p-3 small">
            <div class="mb-1"><b>POST</b> /partner/v1/loan-applications</div>
            <div class="text-muted-lux">Header: <code class="kbd">X-API-KEY</code></div>
          </div>
        </div>
      </div>

      <!-- Main -->
      <div class="col-lg-10">
        <div id="pageContainer"></div>
      </div>
    </div>
  </div>

  <!-- Modal: Create Product -->
  <div class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0">
          <h5 class="modal-title lux-title">Create Loan Product</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label text-muted-lux">Name</label>
              <input id="p_name" class="form-control" placeholder="LAMF Overdraft">
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted-lux">Interest Rate (%)</label>
              <input id="p_rate" class="form-control" type="number" step="0.01" placeholder="14.5">
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted-lux">Max LTV (0.50 = 50%)</label>
              <input id="p_ltv" class="form-control" type="number" step="0.01" placeholder="0.50">
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted-lux">Min Amount</label>
              <input id="p_min" class="form-control" type="number" placeholder="10000">
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted-lux">Max Amount</label>
              <input id="p_max" class="form-control" type="number" placeholder="500000">
            </div>
          </div>
        </div>
        <div class="modal-footer border-0">
          <button class="btn btn-outline-lux" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-lux" id="btnCreateProduct">Create</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Add Collateral -->
  <div class="modal fade" id="collateralModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0">
          <h5 class="modal-title lux-title">Add Collateral (Mutual Fund Units)</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="c_appId">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label text-muted-lux">Scheme Name</label>
              <input id="c_scheme" class="form-control" placeholder="HDFC Flexi Cap Fund">
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted-lux">Units</label>
              <input id="c_units" class="form-control" type="number" step="0.01" placeholder="400">
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted-lux">NAV</label>
              <input id="c_nav" class="form-control" type="number" step="0.01" placeholder="230">
            </div>
          </div>
        </div>
        <div class="modal-footer border-0">
          <button class="btn btn-outline-lux" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-lux" id="btnAddCollateral">Add</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Repay -->
  <div class="modal fade" id="repayModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0">
          <h5 class="modal-title lux-title">Record Repayment</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="r_loanId">
          <label class="form-label text-muted-lux">Amount</label>
          <input id="r_amount" class="form-control" type="number" step="0.01" placeholder="10000">
        </div>
        <div class="modal-footer border-0">
          <button class="btn btn-outline-lux" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-lux" id="btnRepay">Submit</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
